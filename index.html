<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>SIDE/QUEST</title>
<link href="https://fonts.googleapis.com/css2?family=Tomorrow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: #0a0a0a;
    color: #cccccc;
    font-family: 'Tomorrow', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  @supports (height: 100dvh) {
    html, body { height: 100dvh; }
    .page { height: 100dvh; }
  }

  /* grid texture */
  .grid-bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(#1a1a1a 0.5px, transparent 0.5px),
      linear-gradient(90deg, #1a1a1a 0.5px, transparent 0.5px);
    background-size: 48px 48px;
    opacity: 0.5;
  }

  .top-accent {
    position: fixed; top: 0; left: 0; right: 0;
    height: 3px; background: #1B5E37; z-index: 100;
  }

  .page {
    position: relative; z-index: 1;
    height: 100vh;
    display: flex; flex-direction: column;
    justify-content: space-between;
    padding: 22px 24px 22px;
  }

  /* ── TOP ── */
  .top-row {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 8px;
  }
  .logo {
    font-family: 'Tomorrow', sans-serif;
    font-size: 16px; font-weight: 600;
    color: #ffffff;
    letter-spacing: 0.04em;
  }
  .logo span { color: #52B788; }

  .live-pill {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; letter-spacing: 0.12em; color: #B0B0B0; text-decoration: none;
  }
  .live-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #52b788;
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.2} }

  /* ── HERO ── */
  .hero {
    flex: 1;
    display: flex; flex-direction: column; justify-content: center;
  }

  .hero-eyebrow {
    font-size: 12px; letter-spacing: 0.16em;
    color: #52b788;
    margin-bottom: 10px;
  }

  .hero-title {
    font-family: 'Tomorrow', sans-serif;
    font-size: clamp(38px, 11vw, 96px);
    font-weight: 600;
    color: #ffffff;
    letter-spacing: 0;
    line-height: 0.92;
    margin-bottom: 10px;
  }
  .hero-title .slash { color: #52B788; }

  .split-bar {
    display: flex; height: 4px; width: 160px;
    border-radius: 2px; overflow: hidden;
    margin-bottom: 10px;
  }
  .split-a { flex: 1; background: #52b788; }
  .split-b { flex: 1; background: #D4A017; }

  .hero-desc {
    font-size: 15px;
    color: #C8C8C8;
    line-height: 1.8;
    margin-bottom: 18px;
  }

  /* ── CTA BUTTON — green bg, dark text ── */
  .cta {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: 'Tomorrow', sans-serif;
    font-size: 14px; font-weight: 600; letter-spacing: 0.06em;
    color: #0a0a0a;
    background: #52b788;
    border: none; border-radius: 6px;
    padding: 16px 28px;
    cursor: pointer; text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    width: fit-content;
  }
  .cta:active { background: #40916c; }

  /* ── BOTTOM ── */
  .bottom-row {
    display: flex; justify-content: space-between; align-items: flex-end;
    flex-shrink: 0;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  .tagline {
    font-family: 'Tomorrow', sans-serif; font-weight: 500;
    font-size: 12px; letter-spacing: 0.14em;
    color: #BDBDBD;
    margin-bottom: 5px;
  }
  .domain {
    font-family: 'Tomorrow', sans-serif;
    font-size: 12px; letter-spacing: 0.1em;
    color: #52B788;
  }

  .steps { text-align: right; flex-shrink: 0; }
  .step-line {
    font-size: 12px; letter-spacing: 0.06em;
    color: #B0B0B0;
    line-height: 1.9;
  }
  .step-num { color: #52B788; margin-right: 8px; }
</style>
</head>
<body>

<div class="grid-bg"></div>
<div class="top-accent"></div>

<div class="page">

  <div class="top-row">
    <div class="logo">SIDE<span>/</span>QUEST</div>
    <a class="live-pill" href="tracker.html"><div class="live-dot"></div>QUEST #001</a>
  </div>

  <div class="hero">
    <div class="hero-eyebrow">// THE WORLD'S FIRST ROLLING OPINION POLL</div>
    <div class="hero-title">PICK<br>A<br>SIDE</div>
    <div class="split-bar">
      <div class="split-a"></div>
      <div class="split-b"></div>
    </div>
    <div class="hero-desc">Two sides. Real money.<br>Anyone can flip the board.</div>
    <a class="cta" href="tracker.html">// SEE THE LIVE QUEST &nbsp;→</a>
  </div>

  <div class="bottom-row">
    <div>
      <div class="tagline">EVERY OPINION HAS A PRICE</div>
      <div class="domain">SIDEQUEST.VOTE</div>
    </div>
    <div class="steps">
      <div class="step-line"><span class="step-num">01</span>SCAN THE QR</div>
      <div class="step-line"><span class="step-num">02</span>PICK A SIDE</div>
      <div class="step-line"><span class="step-num">03</span>FLIP THE BOARD</div>
    </div>
  </div>

</div>

</body>
</html>
